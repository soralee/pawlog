name: EAS iOS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - development-simulator
          - preview
        default: development-simulator

permissions:
  contents: read

concurrency:
  group: eas-ios-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS iOS build
        run: eas build --platform ios --profile "${{ inputs.profile }}" --non-interactive
